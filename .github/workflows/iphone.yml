name: Build iPhone package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/iphone.yml'
      - 'client/ios/**'
      - 'client/lib/**'
      - 'client/pubspec.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        run: |
          git clone --branch 3.38.7 --depth 1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build unsigned device app
        working-directory: client
        run: flutter build ios --release --no-codesign
      - name: Package IPA for device signing
        working-directory: client
        run: |
          app=build/ios/iphoneos/Runner.app
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist"
          lipo -verify_arch arm64 "$app/Runner"
          mkdir -p "$RUNNER_TEMP/vtoh/Payload"
          ditto "$app" "$RUNNER_TEMP/vtoh/Payload/Runner.app"
          cd "$RUNNER_TEMP/vtoh"
          ditto -ck --norsrc --keepParent Payload VtoH-iPhone.ipa
          unzip -tq VtoH-iPhone.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VtoH-iPhone
          path: ${{ runner.temp }}/vtoh/VtoH-iPhone.ipa
