<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'">
  <title>VtoH</title>
  <link rel="stylesheet" href="workspace.css">
  <script defer src="workspace.js"></script>
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span>VtoH</span>
    </div>
    <div class="header-actions">
      <button id="pair" class="quiet" disabled>手机配对</button>
      <button id="overlay" class="quiet" title="悬浮字幕 · Ctrl + Alt + F10">悬浮字幕</button>
      <button id="settings" class="quiet">设置</button>
    </div>
  </header>
  <main>
    <section class="session" aria-label="监听设置">
      <div class="session-heading">
        <h1>实时字幕</h1>
        <span id="state" class="status" role="status">待机</span>
      </div>
      <div class="session-options">
        <label>播放音源<select id="source" aria-label="播放音源"></select></label>
        <button id="refresh" class="quiet" title="刷新播放音源">刷新</button>
        <label>翻译为<select id="language" aria-label="翻译为">
          <option value="">关闭翻译</option><option value="zh">简体中文</option>
          <option value="en">英语</option><option value="ja">日语</option>
          <option value="ko">韩语</option><option value="fr">法语</option>
          <option value="es">西班牙语</option><option value="de">德语</option>
        </select></label>
      </div>
    </section>
    <div class="panes">
      <section class="pane" aria-label="字幕和翻译">
        <div class="pane-bar">
          <div class="tabs" role="group" aria-label="字幕视图">
            <button id="originals" aria-pressed="true">原文</button>
            <button id="bilingual" aria-pressed="false">双语</button>
          </div>
          <button id="answer" class="quiet" disabled>回答这段</button>
        </div>
        <div id="transcripts" class="stream" tabindex="0"></div>
      </section>
      <section class="pane answers" aria-label="问答">
        <div class="pane-bar"><h2>问答</h2></div>
        <div id="answers" class="stream" tabindex="0"></div>
      </section>
    </div>
    <footer class="dock">
      <div class="level">
        <label for="signal">输入电平</label>
        <meter id="signal" min="0" max="20000" value="0"></meter>
      </div>
      <p id="notice" role="status"></p>
      <button id="capture" class="primary" disabled title="开始或停止监听 · Ctrl + Alt + F9"><span class="play" aria-hidden="true"></span><span id="capture-label">开始监听</span></button>
    </footer>
  </main>
  <dialog id="settings-dialog">
    <form id="connection-form">
      <h2>连接设置</h2>
      <label>访问密钥<input id="key" type="password" autocomplete="off"></label>
      <p id="settings-error" role="alert"></p>
      <div class="dialog-actions">
        <button class="quiet" id="cancel" type="button">取消</button>
        <button class="primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>
  <dialog id="pair-dialog">
    <h2>手机配对</h2>
    <img id="qr" alt="会话配对二维码" width="232" height="232">
    <p>用手机相机或 VtoH 扫描二维码。</p>
    <form method="dialog" class="dialog-actions">
      <button class="quiet" id="copy-pair" type="button">复制链接</button><button class="quiet">关闭</button>
    </form>
  </dialog>
</body>
</html>
